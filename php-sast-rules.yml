rules:
  # 1 ─ Inyección SQL (taint)
  - id: php-sql-injection
    languages: [php]
    severity: ERROR
    mode: taint
    message: "Posible inyección SQL (CWE-89): entrada del usuario llega a una consulta."
    metadata: { owasp: "A03:2021 - Injection", cwe: "CWE-89", categoria: "SQL Injection" }
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
    pattern-sinks:
      - pattern: mysql_query(...)
      - pattern: mysqli_query(...)
      - pattern: sqlite_query(...)
      - pattern: $O->query(...)

  # 2 ─ Inyección de comandos (taint)
  - id: php-command-injection
    languages: [php]
    severity: ERROR
    mode: taint
    message: "Posible inyección de comandos del SO (CWE-78): entrada del usuario llega a una función de shell."
    metadata: { owasp: "A03:2021 - Injection", cwe: "CWE-78", categoria: "Command Injection" }
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
    pattern-sinks:
      - pattern: shell_exec(...)
      - pattern: exec(...)
      - pattern: system(...)
      - pattern: passthru(...)
      - pattern: popen(...)
      - pattern: proc_open(...)

  # 3 ─ Ejecución de código con eval (patrón)
  - id: php-eval-injection
    languages: [php]
    severity: ERROR
    message: "Uso de eval() con datos dinámicos (CWE-95): riesgo de ejecución remota de código."
    metadata: { owasp: "A03:2021 - Injection", cwe: "CWE-95", categoria: "Code Injection (eval)" }
    patterns:
      - pattern: eval(...)
      - pattern-not: eval("...")

  # 4 ─ XSS reflejado (taint)
  - id: php-xss-reflected
    languages: [php]
    severity: WARNING
    mode: taint
    message: "Posible XSS reflejado (CWE-79): entrada del usuario se imprime sin codificar."
    metadata: { owasp: "A03:2021 - Injection", cwe: "CWE-79", categoria: "XSS" }
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
    pattern-sinks:
      - pattern: echo ...;
      - pattern: print(...)
    pattern-sanitizers:
      - pattern: htmlspecialchars(...)
      - pattern: htmlentities(...)

  # 5 ─ Inclusión de archivos LFI/RFI (taint)
  - id: php-file-inclusion
    languages: [php]
    severity: ERROR
    mode: taint
    message: "Posible LFI/RFI (CWE-98): entrada del usuario controla un include/require."
    metadata: { owasp: "A03:2021 - Injection", cwe: "CWE-98", categoria: "File Inclusion" }
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
    pattern-sinks:
      - pattern: include $X
      - pattern: include_once $X
      - pattern: require $X
      - pattern: require_once $X

  # 6 ─ Inyección LDAP (taint)
  - id: php-ldap-injection
    languages: [php]
    severity: ERROR
    mode: taint
    message: "Posible inyección LDAP (CWE-90): entrada del usuario llega a una consulta LDAP."
    metadata: { owasp: "A03:2021 - Injection", cwe: "CWE-90", categoria: "LDAP Injection" }
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
    pattern-sinks:
      - pattern: ldap_search(...)
      - pattern: ldap_list(...)
      - pattern: ldap_read(...)
      - pattern: ldap_bind(...)

  # 7 ─ Inyección en correo (taint)
  - id: php-mail-injection
    languages: [php]
    severity: WARNING
    mode: taint
    message: "Posible inyección de cabeceras de correo (CWE-93): entrada del usuario llega a mail()."
    metadata: { owasp: "A03:2021 - Injection", cwe: "CWE-93", categoria: "Mail Injection" }
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
    pattern-sinks:
      - pattern: mail(...)

  # 8 ─ Redirección abierta (patrón)
  - id: php-open-redirect
    languages: [php]
    severity: WARNING
    message: "Redirección con destino dinámico (CWE-601): posible redirección abierta."
    metadata: { owasp: "A01:2021 - Broken Access Control", cwe: "CWE-601", categoria: "Open Redirect" }
    patterns:
      - pattern: header("..." . $X)
      - pattern-regex: (?i)location

  # 9 ─ Hash débil (patrón)
  - id: php-weak-hash
    languages: [php]
    severity: WARNING
    message: "Algoritmo de hash débil MD5/SHA1 (CWE-328): no apto para contraseñas ni integridad."
    metadata: { owasp: "A02:2021 - Cryptographic Failures", cwe: "CWE-328", categoria: "Weak Hash" }
    pattern-either:
      - pattern: md5(...)
      - pattern: sha1(...)

  # 10 ─ Cifrado débil / codificación tratada como cifrado (patrón)
  - id: php-weak-crypto
    languages: [php]
    severity: WARNING
    message: "Cifrado débil u obsoleto (CWE-327): revisar si se usa para proteger datos sensibles."
    metadata: { owasp: "A02:2021 - Cryptographic Failures", cwe: "CWE-327", categoria: "Weak Crypto" }
    pattern-either:
      - pattern: base64_encode(...)
      - pattern: str_rot13(...)
      - pattern: mcrypt_encrypt(...)
      - pattern: mcrypt_decrypt(...)

  # 11 ─ Deserialización insegura (taint)
  - id: php-unsafe-deserialization
    languages: [php]
    severity: ERROR
    mode: taint
    message: "Deserialización de datos no confiables (CWE-502): posible inyección de objetos."
    metadata: { owasp: "A08:2021 - Software and Data Integrity Failures", cwe: "CWE-502", categoria: "Insecure Deserialization" }
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
    pattern-sinks:
      - pattern: unserialize(...)

  # 12 ─ extract() (patrón)
  - id: php-extract-usage
    languages: [php]
    severity: WARNING
    message: "Uso de extract() (CWE-621): puede sobrescribir variables con datos del usuario."
    metadata: { owasp: "A03:2021 - Injection", cwe: "CWE-621", categoria: "Variable Overwrite" }
    pattern: extract(...)

  # 13 ─ Credenciales embebidas (patrón)
  - id: php-hardcoded-credentials
    languages: [php]
    severity: WARNING
    message: "Credencial embebida en el código (CWE-798)."
    metadata: { owasp: "A07:2021 - Identification and Authentication Failures", cwe: "CWE-798", categoria: "Hardcoded Credentials" }
    patterns:
      - pattern: $VAR = "$VALUE";
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)\$\w*(pass|passwd|password|pwd|secret)\w*$
      - metavariable-regex:
          metavariable: $VALUE
          regex: .+

  # 14 ─ phpinfo() (patrón)
  - id: php-phpinfo-disclosure
    languages: [php]
    severity: INFO
    message: "phpinfo() expone la configuración del servidor (CWE-200)."
    metadata: { owasp: "A05:2021 - Security Misconfiguration", cwe: "CWE-200", categoria: "Information Disclosure" }
    pattern: phpinfo(...)
